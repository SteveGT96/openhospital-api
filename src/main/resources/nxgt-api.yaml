      summary: Update partially category
      operationId: patchCategory
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchCategoryRequestBody'
            encoding:
              user:
