    delete:
      tags:
        - users-controller
      summary: Delete user
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          $ref: '#/components/responses/ResourceDeleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{id}/avatar:
    patch:
      tags:
        - users-controller
      summary: Upload avatar to user
      operationId: uploadUserAvatar
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: The updated user with new avatar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - users-controller
      summary: Delete avatar from user
      operationId: deleteUserAvatar
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The updated user after avatar deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{id}/roles:
    get:
      tags:
        - users-controller
      summary: Get user roles
      operationId: findUserRoles
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: List of roles assigned to the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
                description: List of roles assigned to the user
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{id}/permissions:
    get:
      tags:
        - users-controller
      summary: Get user permissions
      operationId: findUserPermissions
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: List of permissions assigned to the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
                description: List of permissions assigned to the user
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: Basic authentication
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token
  schemas:
    SignInRequest:
      type: object
      properties:
        username:
          type: string
          description: The username or email address(if applicable) of the user.
        password:
          type: string
          description: The password for the user account.
      required:
        - username
        - password
    Token:
      type: object
      properties:
        uid:
          type: string
          description: The user identifier associated with the token.
        access:
          type: string
          description: The access token.
        refresh:
          type: string
          description: The refresh token.
      required:
        - uid
        - access
        - refresh
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: Error status code
        message:
          type: string
          description: A human-readable error message.
          default: ''
        debugMessage:
          type: string
          description: An optional debug message for troubleshooting.
          default: null
    SignUpRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 20
          description: The username of the user.
        email:
          type: string
          format: email
          description: The email address of the user.
        password:
          type: string
          minLength: 4
          maxLength: 100
          description: The password for the user account.
      required:
        - username
        - password
        - email
    AccountStatus:
      type: string
      description: Represents the status of a user account.
      enum:
        - ACTIVE
        - SUSPENDED
        - PENDING
        - DISABLED
        - EXPIRED
    JsonObject:
      type: object
      format: json
    AuditMetadata:
      type: object
      properties:
        createdBy:
          type: string
          description: The user who created the attribute.
        createdDate:
          type: string
          format: date-time
          description: The date and time when the attribute was created.
        lastModifiedBy:
          type: string
          description: The user who last updated the attribute.
        lastModifiedDate:
          type: string
          format: date-time
          description: The date and time when the attribute was last updated.
      required:
        - createdBy
        - createdDate
        - lastModifiedBy
        - lastModifiedDate
    User:
      type: object
      description: Represents a user in the system.
      required:
        - id
        - email
        - username
        - emailVerified
        - roles
        - groups
        - status
        - metadata
        - version
      properties:
        id:
          type: string
          description: The unique identifier of the user.
        email:
          type: string
          format: email
          description: The email address of the user.
        username:
          type: string
          description: The unique username of the user.
        emailVerified:
          type: boolean
          description: Indicates if the user's email address has been verified.
        roles:
          type: array
          description: The roles assigned to the user.
          items:
            type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        firstName:
          type: string
          description: The first name of the user.
        lastName:
          type: string
          description: The last name of the user.
        birthDate:
          type: string
          format: date
          description: The birth date of the user.
        avatar:
          type: string
          description: The URL or identifier of the user's avatar.
        locale:
          type: string
          description: Preferred locale (e.g. en-US, fr-FR).
        timezone:
          type: string
          description: Preferred timezone (e.g. Europe/Paris).
        bio:
          type: string
          description: A short biography of the user.
        preferences:
          $ref: '#/components/schemas/JsonObject'
          description: User preferences as a JSON object.
        attributes:
          $ref: '#/components/schemas/JsonObject'
          description: Custom attributes as a JSON object.
        deviceInfo:
          $ref: '#/components/schemas/JsonObject'
          description: Device information as a JSON object.
        metadata:
          $ref: '#/components/schemas/AuditMetadata'
        version:
          type: integer
          minimum: 0
          description: Version used for optimistic concurrency control.
    RefreshTokenRequest:
      type: object
      properties:
        token:
          type: string
          description: The refresh token.
        uid:
          type: string
          description: The user identifier associated with the token.
      required:
        - uid
        - token
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the category.
        family:
          type: string
          description: The family or group to which the category belongs.
        description:
          type: string
          description: A brief description of the category.
        attributes:
          type: array
          items:
            type: string
          description: A set of attribute IDs to be associated with the category.
      required:
        - name
    Upload:
      type: string
      format: binary
      description: File to upload
    CategoryRequestBody:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/CategoryRequest'
        photo:
          $ref: '#/components/schemas/Upload'
      required:
        - category
    Category:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the category.
        name:
          type: string
          description: The name of the category.
        family:
          type: string
          description: The family or group to which the category belongs.
        description:
          type: string
          description: A brief description of the category.
        photo:
          type: string
          description: A URL to a photo representing the category.
        attributes:
          type: array
          items:
            type: string
          description: A set of attribute IDs associated with the category.
        metadata:
          $ref: '#/components/schemas/AuditMetadata'
          description: Metadata related to the creation and update of the category.
      required:
        - id
        - name
        - metadata
    SortDirection:
      type: string
      enum:
        - ASC
        - DESC
      description: The direction in which to sort results.
    SortItem:
      type: object
      required:
        - key
        - direction
      properties:
        key:
          type: string
          description: The field to sort by
        direction:
          $ref: '#/components/schemas/SortDirection'
          description: The direction in which to sort results
    SearchRequest:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/JsonObject'
          description: The search filter object
        sort:
          type: array
          items:
            $ref: '#/components/schemas/SortItem'
          description: The list of fields to sort by
    PageInfo:
      type: object
      properties:
        number:
          type: integer
          description: The current page number (1-indexed)
        size:
          type: integer
          description: The size of the page
        numberOfElements:
          type: integer
          description: The number of elements on the current page
        totalElements:
          type: integer
          description: The total number of elements
        totalPages:
          type: integer
          description: The total number of pages
        hasPreviousPage:
          type: boolean
          description: Whether there is a previous page
        hasNextPage:
          type: boolean
          description: Whether there is a next page
        previousPage:
          type: integer
          description: The number of the previous page (if exists)
        nextPage:
          type: integer
          description: The number of the next page (if exists)
    PaginatedCategory:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          description: A list of category objects.
        metadata:
          $ref: '#/components/schemas/PageInfo'
    PatchCategoryRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the category.
        family:
          type: string
          description: The family or group to which the category belongs.
        description:
          type: string
          description: A brief description of the category.
        attributes:
          type: array
          items:
            type: string
          description: A set of attribute IDs to be associated with the category.
    PatchCategoryRequestBody:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/PatchCategoryRequest'
        photo:
          $ref: '#/components/schemas/Upload'
    PermissionRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the permission being requested.
        description:
          type: string
          description: A human-readable description of the permission.
      required:
        - name
    Permission:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the permission.
          readOnly: true
        name:
          type: string
          description: The name of the permission.
        description:
          type: string
          description: A human-readable description of the permission.
        metadata:
          $ref: '#/components/schemas/AuditMetadata'
          description: Metadata related to the creation and update of the permission.
      required:
        - id
        - name
        - metadata
    PaginatedPermission:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: A list of permission objects.
        metadata:
          $ref: '#/components/schemas/PageInfo'
    PatchPermissionRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the permission being requested.
        description:
          type: string
          description: A human-readable description of the permission.
    RoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 20
          description: The name of the role.
        description:
          type: string
          description: A brief description of the role.
        permissions:
          type: array
          items:
            type: string
          description: The users to be assigned to the role.
      required:
        - name
    Role:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the role.
        name:
          type: string
          description: The name of the role.
        description:
          type: string
          description: A brief description of the role.
        permissions:
          type: array
          items:
            type: string
          description: The users associated with the role.
        metadata:
          $ref: '#/components/schemas/AuditMetadata'
          description: Metadata related to the creation and update of the role.
      required:
        - id
        - name
        - users
        - metadata
    PaginatedRole:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: A list of role objects.
        metadata:
          $ref: '#/components/schemas/PageInfo'
    StringListPatch:
      type: object
      properties:
        add:
          type: array
          items:
            type: string
          description: The items to add to the list
        remove:
          type: array
          items:
            type: string
          description: The items to remove from the list
        replace:
          type: array
          items:
            type: string
          description: The items to replace the list items with
    PatchRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 20
          description: The name of the role.
        description:
          type: string
          description: A brief description of the role.
        permissions:
          $ref: '#/components/schemas/StringListPatch'
    AttributeType:
      type: string
      description: Enumeration of possible data types for an attribute.
      enum:
        - FILE
        - STRING
        - NUMBER
        - BOOLEAN
        - DATE
        - DATETIME
        - ENUM
        - JSON
    AttributeRequest:
      type: object
      description: Input type for creating or updating an attribute.
      properties:
        name:
          type: string
          description: The name of the attribute (e.g., 'color', 'size').
        family:
          type: string
          description: The family or category of the attribute.
        unit:
          type: string
          nullable: true
          description: The unit of the attribute's value (e.g., 'cm', 'GB', 'm').
        description:
          type: string
          nullable: true
          description: A detailed description of the attribute (optional).
        type:
          $ref: '#/components/schemas/AttributeType'
        options:
          type: array
          nullable: true
          description: A list of predefined options for the attribute, supporting dropdowns or selections (optional).
          items:
            $ref: '#/components/schemas/JsonObject'
        defaultValue:
          $ref: '#/components/schemas/JsonObject'
          description: The default value of the attribute (optional).
        required:
          type: boolean
          description: Indicates if the attribute is required.
        isMultiValued:
          type: boolean
          description: Indicates if the attribute supports multiple values.
      required:
        - name
        - type
        - required
        - isMultiValued
    Attribute:
      type: object
      description: |
        Represents an attribute within the system. Attributes define customizable properties of a resource, supporting internationalization, default values, and predefined options.
      properties:
        id:
          type: string
          description: The unique identifier of the attribute.
        name:
          type: string
          description: The name of the attribute, used for identification (e.g., 'color', 'size').
        family:
          type: string
          description: The family or category of the attribute.
        description:
          type: string
          nullable: true
          description: A detailed description of the attribute, explaining its purpose or usage.
        type:
          $ref: '#/components/schemas/AttributeType'
        unit:
          type: string
          nullable: true
          description: The unit of the attribute's value (e.g., 'cm', 'GB', 'm').
        options:
          type: array
          nullable: true
          description: A list of predefined options for the attribute, supporting dropdowns or selections (optional).
          items:
            $ref: '#/components/schemas/JsonObject'
        defaultValue:
          $ref: '#/components/schemas/JsonObject'
          description: The default value of the attribute (optional).
        required:
          type: boolean
          description: Indicates if the attribute is required.
