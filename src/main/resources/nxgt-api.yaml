openapi: 3.1.0
info:
  description: REST API with Spring Boot
  title: NXGT Spring Boot
  version: 1.0.0
servers:
  - description: Dev server
    url: http://localhost:8080
security:
  - Bearer: [ ]
tags:
  - name: auth-controller
    description: Auth controller
  - name: users-controller
    description: Users controller
  - name: roles-controller
    description: Roles controller
  - name: attributes-controller
    description: Attributes controller
  - name: tags-controller
    description: Tags controller
  - name: categories-controller
    description: Categories controller
  - name: uploads-controller
    description: Uploads controller
paths:
  /auth/login:
    post:
      tags:
        - auth-controller
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: The newly created token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      security: [ ]
  /auth/register:
    post:
      tags:
        - auth-controller
      summary: Create Account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: The newly created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      security: [ ]
  /auth/refresh-token:
    post:
      tags:
        - auth-controller
      summary: Refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: The refreshed token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      security: [ ]
  /auth/logout:
    post:
      tags:
        - auth-controller
      summary: Logout
      operationId: logout
      responses:
        '204':
          description: Logout successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      security: [ ]
  /categories:
    post:
      tags:
        - categories-controller
      summary: Create category.
      operationId: createCategory
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequestBody'
            encoding:
              user:
                contentType: application/json
              photo:
                contentType: image/*
      responses:
        '201':
          description: The newly created category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /categories/search:
    post:
      tags:
        - categories-controller
      summary: Get categories
      operationId: findCategories
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/paged'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: A paginated list of categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
